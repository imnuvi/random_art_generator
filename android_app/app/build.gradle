plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'blog.ramprakash.merge'
    signingConfigs {
        testing {
            storeFile file('/Users/ramprakash/tools/Keystore/private_key.pepk')
            storePassword 'tyche'
            keyAlias 'tyche'
            keyPassword 'tyche'
        }
        random_art_generator {
            storeFile file('/Users/ramprakash/development/keystore/tyche_keystore.jks')
            storePassword 'tyche_keystore'
            keyAlias 'tyche_keystore'
            keyPassword 'tyche_keystore'
        }
    }
    compileSdk 35

    defaultConfig {
        applicationId "blog.ramprakash.merge"
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            debuggable = false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.random_art_generator
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}